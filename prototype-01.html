<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-text="pageTitle"></title><link rel="stylesheet" href="styles.css"></head>
<body class="race-page" data-prototype="prototype-01"><header class="topbar"><a href="index.html" class="back-link" data-text="back" data-label="backLabel"></a><span class="topbar-title" data-prototype-name></span><button id="header-reset" class="icon-button" data-label="restart" data-title="restart" data-icon="restart"></button></header>
<main class="race" id="race"><canvas id="scene" data-label="scene"></canvas><div class="scene-vignette"></div>
<section class="race-info" data-label="raceProgress"><div class="position"><strong id="position">3</strong><span>/ 6</span></div><div class="race-meta"><span id="progress-label">0%</span><span id="race-time">00:00.0</span></div><div class="progress-track" role="progressbar" data-label="distance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="race-progress"></span></div></section>

<section class="map-dock" data-label="minimap"><button id="map-toggle" class="map-tab" aria-expanded="true" data-label="toggleMap" data-title="toggleMapHelp" aria-controls="map-content" data-icon="map"></button><div id="map-content" class="instrument map-content"><div class="panel-heading"><span></span><button id="map-expand" class="small-button" data-label="expandMap" data-title="expandMap" data-icon="expand"></button></div><svg id="mini-map" viewBox="0 0 180 270" role="img" data-label="route"><path class="map-route-shadow"/><path class="map-route"/><path class="finish-line"/><circle class="start-marker" r="8"/><g id="map-markers"></g></svg><div class="map-legend"><span><i class="player-dot"></i><span data-text="you"></span></span><span><i class="rival-dot"></i><span data-text="otherRacers"></span></span></div></div></section>
<div id="ability-feedback" class="ability-feedback" role="status"></div>
<section hidden class="dialogue instrument" id="dialogue" data-label="conversation"><div class="portrait-stack"><div id="portrait-npc" class="portrait active"><span class="portrait-art" data-icon="npcPortrait"></span><span data-text="npc"></span></div><div id="portrait-player" class="portrait"><span class="portrait-art" data-icon="playerPortrait"></span><span data-text="you"></span></div></div><div class="dialogue-body"><div class="panel-heading"><span><i class="live-dot"></i> </span><button id="dialog-close" class="small-button" data-label="closeConversation" data-icon="close"></button></div><p id="speaker" class="speaker" data-text="npc"></p><p id="dialog-text" class="dialog-text"></p><div class="dialogue-footer"><span id="dialog-step">1 / 4</span><span class="radio-wave" aria-hidden="true">~~~</span></div></div></section>
<section class="abilities" data-label="abilities"><div class="ability-row"><button class="ability instrument" data-ability="0" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/></svg><span class="ability-key"></span></button><button class="ability instrument" data-ability="1" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/></svg><span class="ability-key"></span></button><button class="ability instrument" data-ability="2" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36"/></svg><span class="ability-key"></span></button></div><div id="ability-detail" class="ability-detail instrument" hidden><div class="panel-heading"><strong id="ability-name"></strong><button id="ability-close" class="small-button" data-label="closeAbility" data-icon="close"></button></div><p id="ability-description"></p><div class="detail-footer"><span id="ability-timing"></span><button id="ability-activate" data-text="activate"></button></div></div></section>

<div id="finish-banner" class="finish-banner" role="status" hidden><p data-text="finishIntro"></p><h1 data-text="finishTitle"></h1><p id="result"></p><button id="finish-reset" data-text="finishRestart"></button></div></main>
<aside class="test-bench"><button id="controls-toggle" data-text="showTools" aria-expanded="false" aria-controls="demo-controls"></button><section id="demo-controls" hidden><h2 data-text="testTools"></h2><p id="sim-status"></p><div id="preparation"><p data-text="prepHint"></p><div id="marble-editor"></div><fieldset><legend data-text="enabledEvents"></legend><div id="event-options"></div></fieldset><button id="start-race" data-text="startRace"></button></div><div id="live-tools" hidden><div id="event-triggers"></div><button id="pause" data-text="pause"></button></div><p data-text="keyboard"></p></section></aside>
<dialog id="map-dialog" class="expanded-map instrument"><div class="panel-heading"><h2 data-text="mapHeading"></h2><button id="map-close" class="small-button" data-label="closeMap" data-icon="close"></button></div><div id="large-map"></div><div class="map-legend"><span><i class="player-dot"></i><span data-text="you"></span></span><span><i class="rival-dot"></i><span data-text="otherRacers"></span></span></div><p><span data-text="start"></span><span data-text="finish"></span></p></dialog>
<script src="prototype-config.js"></script><script src="content.js"></script><script src="ability-model.js"></script><script src="radio-model.js"></script><script src="race-model.js"></script><script src="prototype-01.js"></script></body></html>
