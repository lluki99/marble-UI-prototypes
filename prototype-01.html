<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Saltwind Run · Marble</title><link rel="stylesheet" href="styles.css"></head>
<body class="race-page"><header class="topbar"><a href="index.html" class="back-link">← Trails</a><span class="topbar-title">Saltwind Run <span>01</span></span><button id="header-reset" class="icon-button" aria-label="Restart demo" title="Restart demo">↺</button><button class="icon-button" aria-label="Demo controls" title="Demo controls" id="controls-toggle" aria-expanded="false" aria-controls="demo-controls">☷</button></header>
<main class="race" id="race"><canvas id="scene" aria-label="Six marbles racing along a sunlit coastal trail"></canvas><div class="scene-vignette"></div>
<section class="race-info" aria-label="Race progress"><div class="position"><strong id="position">3</strong><span>/ 6</span></div><div class="race-meta"><span id="progress-label">0%</span><span id="race-time">00:00.0</span></div><div class="progress-track" role="progressbar" aria-label="Distance to finish" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="race-progress"></span></div></section>

<section class="map-dock" aria-label="Minimap"><button id="map-toggle" class="map-tab" aria-expanded="true" aria-label="Toggle minimap" title="Toggle minimap (M)" aria-controls="map-content"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 12L19 8L30 13L40 9V36L30 40L19 35L8 39ZM19 8V35M30 13V40"/></svg><span id="map-chevron" aria-hidden="true">›</span></button><div id="map-content" class="instrument map-content"><div class="panel-heading"><span></span><button id="map-expand" class="small-button" aria-label="Expand minimap" title="Expand minimap">⤢</button></div><svg id="mini-map" viewBox="0 0 180 270" role="img" aria-label="Open road from start to finish with six racers"><path class="map-route-shadow" d="M112 242L133 222Q151 192 114 166Q83 143 114 121Q148 90 102 72Q50 52 66 28L94 28"/><path class="map-route" d="M112 242L133 222Q151 192 114 166Q83 143 114 121Q148 90 102 72Q50 52 66 28L94 28"/><path class="finish-line" d="M94 14V42M94 14H112V25H94"/><circle class="start-marker" cx="112" cy="242" r="8"/><g id="map-markers"></g></svg><div class="map-legend"><span><i class="player-dot"></i>You</span><span><i class="rival-dot"></i>Other racers</span></div></div></section>
<div id="ability-feedback" class="ability-feedback" role="status"></div>
<section class="dialogue instrument" id="dialogue" aria-label="Radio conversation"><div class="portrait-stack"><div id="portrait-npc" class="portrait active"><svg viewBox="0 0 90 90" aria-hidden="true"><path fill="#66877a" d="M8 90V70L31 57H59L82 70V90Z"/><path fill="#d99a74" d="M29 21L45 17L63 26L59 53L47 64L32 53Z"/><path fill="#594b3c" d="M24 29L31 12L57 10L68 28L59 40L55 23L29 38Z"/><path fill="#f4d77a" d="M25 27L28 17L60 17L68 28Z"/><path stroke="#554a3d" stroke-width="3" d="M36 40H40M50 40H54M40 52L49 53"/></svg><span>Vega</span></div><div id="portrait-player" class="portrait"><svg viewBox="0 0 90 90" aria-hidden="true"><path fill="#be6448" d="M9 90V71L32 57H58L81 71V90Z"/><path fill="#ecc398" d="M29 24L46 19L62 27L59 53L45 65L31 53Z"/><path fill="#9b4b36" d="M24 36L25 20L35 11L58 14L66 29L57 34L49 25L31 36Z"/><path fill="#83b8a8" d="M26 61L43 72L64 60L65 76L43 83L27 75Z"/><path stroke="#554a3d" stroke-width="3" d="M35 42H39M50 42H54M40 54H49"/></svg><span>You</span></div></div><div class="dialogue-body"><div class="panel-heading"><span><i class="live-dot"></i> </span><button id="dialog-close" class="small-button" aria-label="Close conversation">×</button></div><p id="speaker" class="speaker">Vega</p><p id="dialog-text" class="dialog-text"></p><div class="dialogue-footer"><span id="dialog-step">1 / 4</span><button id="dialog-next">Next <span aria-hidden="true">›</span></button></div></div></section>
<section class="abilities" aria-label="Abilities"><div class="ability-row"><button class="ability instrument" data-ability="0" aria-controls="ability-detail"><span class="ability-key">Shift</span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 27L24 15L36 27M12 37L24 25L36 37"/></svg><span class="ability-state">Ready</span><span class="cooldown-fill"></span></button><button class="ability instrument" data-ability="1" aria-controls="ability-detail"><span class="ability-key">E</span><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6L39 13V25Q38 35 24 42Q10 35 9 25V13Z"/></svg><span class="ability-state">Ready</span><span class="cooldown-fill"></span></button><button class="ability instrument" data-ability="2" aria-controls="ability-detail"><span class="ability-key">Q</span><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13"/><circle cx="24" cy="24" r="3"/></svg><span class="ability-state">Ready</span><span class="cooldown-fill"></span></button></div><div id="ability-detail" class="ability-detail instrument" hidden><div class="panel-heading"><strong id="ability-name"></strong><button id="ability-close" class="small-button" aria-label="Close ability details">×</button></div><p id="ability-description"></p><div class="detail-footer"><span id="ability-timing"></span><button id="ability-activate">Activate</button></div></div></section>

<div id="finish-banner" class="finish-banner" role="status" hidden><p>That’s the trail.</p><h1>Finish!</h1><button id="finish-reset">Ride again</button></div></main>
<section id="demo-controls" class="demo-controls" hidden aria-label="Simulation controls"><div class="controls-intro"><strong>Try a moment</strong></div><button id="pause">Pause race</button><button id="show-dialog">Radio call</button><button id="force-cooldown">All on cooldown</button><button id="ready-all">All ready</button><button id="overtake">Change position</button><button id="jump-finish">Near the finish</button><button id="reset">↺ Restart demo</button><p>Shift / E / Q: activate · M: map · Space: next line · Esc: close</p></section>
<dialog id="map-dialog" class="expanded-map instrument"><div class="panel-heading"><h2>The coastal trail</h2><button id="map-close" class="small-button" aria-label="Close expanded map">×</button></div><div id="large-map"></div><div class="map-legend"><span><i class="player-dot"></i>You</span><span><i class="rival-dot"></i>Other racers</span></div><p>Start ○ <span>Finish ⚑</span></p></dialog>
