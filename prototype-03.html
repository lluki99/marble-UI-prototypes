<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-text="pageTitle"></title><link rel="stylesheet" href="racers-v2/styles.css?v=blue-hud-01"><link rel="stylesheet" href="racers-v2/layout.css?v=blue-hud-01"><link rel="stylesheet" href="racers-v2/minimap.css?v=blue-hud-01"><link rel="stylesheet" href="prototype-label.css?v=1"><link rel="stylesheet" href="racers-v2/hud-theme.css?v=blue-01"></head>
<body class="race-page race-v2-page race-v3-page" data-prototype="prototype-03"><header class="prototype-header"><a href="index.html" class="iteration-link" data-label="backLabel">← All prototypes<span>Prototype 1 - Iteration 2</span></a><div class="prototype-actions"><button id="controls-toggle" data-text="showTools" aria-expanded="false" aria-controls="demo-controls"></button><button id="header-reset" data-text="restart"></button></div></header>
<main class="race" id="race"><canvas id="scene" data-label="scene"></canvas><div class="scene-vignette"></div>
<section class="race-info" aria-label="Live standings"><h2 class="standings-title">M.A.R.B.L.E. Solar Grand Prix</h2><ol id="live-leaderboard" aria-label="Live race standings"></ol></section>

<section class="map-dock" data-label="minimap"><div id="map-content" class="instrument map-content"><strong id="position" class="map-position" aria-label="Your current position: 3">3</strong><svg id="mini-map" viewBox="0 0 180 270" role="img" data-label="route"><path class="map-route-shadow"/><path class="map-route"/><path class="finish-line"/><circle class="start-marker" r="8"/><g id="map-markers"></g></svg><div class="map-legend"><span><i class="player-dot"></i><span data-text="you"></span></span><span><i class="rival-dot"></i><span data-text="otherRacers"></span></span></div></div></section>

<section class="radio-dock" id="radio-dock" hidden data-label="conversation">
<div id="portrait-player" role="img" class="portrait active" data-label="playerPortrait"><span class="portrait-art" data-icon="playerPortrait"></span></div>
<div class="dialogue instrument" id="dialogue" hidden>
<div class="dialogue-body"><div class="terminal-title"><p id="speaker" class="speaker"></p><span data-text="faction"></span></div><p id="dialog-text" class="dialog-text" aria-live="polite"></p><div class="dialogue-footer"><span id="dialog-step"></span><span data-text="continueRadio"></span></div></div>
<div class="transmission-console"><div class="scan-panel"><p data-text="transmissionScan"></p><div class="scan-matrix" id="scan-matrix" aria-hidden="true"></div></div><div class="communication-link"><span class="radio-marble" id="player-radio-marble"></span><svg class="connection-lines" viewBox="0 0 200 50" aria-hidden="true"><path d="M0 25H30L45 10L62 40L80 18L100 30L120 16L138 37L157 12L175 25H200"/><path class="connection-pulse" d="M0 25H30L45 10L62 40L80 18L100 30L120 16L138 37L157 12L175 25H200"/></svg><span class="radio-marble" id="caller-radio-marble"></span></div></div>
<div id="portrait-npc" role="img" class="portrait" hidden><span class="portrait-art" data-icon="npcPortrait"></span></div>
</div></section>
<section class="abilities" data-label="abilities"><div id="ability-feedback" class="ability-feedback" role="status"></div><div class="ability-row"><button class="ability instrument" data-ability="0" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-track" cx="40" cy="40" r="35"/><circle class="ring-progress" cx="40" cy="40" r="35"/></svg><span class="ability-key"></span></button><button class="ability instrument" data-ability="1" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-track" cx="40" cy="40" r="35"/><circle class="ring-progress" cx="40" cy="40" r="35"/></svg><span class="ability-key"></span></button><button class="ability instrument" data-ability="2" aria-controls="ability-detail"><span class="ability-icon"></span><span class="ability-state"></span><span class="ability-spinner" aria-hidden="true"></span><svg class="cooldown-ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-track" cx="40" cy="40" r="35"/><circle class="ring-progress" cx="40" cy="40" r="35"/></svg><span class="ability-key"></span></button></div><div id="ability-detail" class="ability-detail instrument" hidden><div class="panel-heading"><strong id="ability-name"></strong><button id="ability-close" class="small-button" data-label="closeAbility" data-icon="close"></button></div><p id="ability-description"></p><div class="detail-footer"><span id="ability-timing"></span><button id="ability-activate" data-text="activate"></button></div></div></section>

<section id="finish-banner" class="finish-banner results-screen" aria-labelledby="results-title" hidden><div class="results-layout"><h1 id="results-title" data-text="finishTitle"></h1><div class="results-content"><div id="results-podium" class="results-podium"></div><p id="result" class="player-result" role="status"></p><div class="results-table-head"><span data-text="resultsRacer"></span><span data-text="resultsProgress"></span><span data-text="resultsArrival"></span></div><ol id="results-ranking" class="results-ranking"></ol><div class="results-actions"><button id="results-reset" data-text="restart"></button><a href="index.html" data-text="back"></a></div></div></div></section></main>
<aside class="test-bench"><section id="demo-controls" hidden><h2 data-text="testTools"></h2><p id="sim-status"></p><details class="ability-settings"><summary data-text="abilitySettings"></summary><p data-text="timingHint"></p><div id="ability-settings"></div></details><div id="marble-editor"></div><div id="preparation"><p data-text="prepHint"></p><fieldset><legend data-text="enabledEvents"></legend><div id="event-options"></div></fieldset><button id="start-race" data-text="startRace"></button></div><div id="live-tools" hidden><h3 data-text="dialogueTriggers"></h3><div id="event-triggers"></div><button id="pause" data-text="pause"></button></div><p data-text="keyboard"></p></section></aside>

<script src="racers-v2/config.js?v=blue-hud-01"></script><script src="racers-v2/content.js?v=blue-hud-01"></script><script src="racers-v2/ability-model.js?v=blue-hud-01"></script><script src="racers-v2/radio-model.js?v=blue-hud-01"></script><script src="racers-v2/race-model.js?v=blue-hud-01"></script><script src="racers-v2/camera-model.js?v=blue-hud-01"></script><script src="racers-v2/leaderboard.js?v=blue-hud-01"></script><script src="racers-v2/race.js?v=blue-hud-01"></script></body></html>
