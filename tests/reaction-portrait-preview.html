<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../"><title>Reaction portrait regression preview</title><link rel="stylesheet" href="racers-v2/styles.css?v=portrait-clean-02"><link rel="stylesheet" href="racers-v2/hud-theme.css?v=portrait-clean-02"><link rel="stylesheet" href="racers-v2/reaction.css?v=portrait-clean-02"></head><body class="race-v2-page" style="background:#835c51"><main style="height:420px;position:relative" id="preview"></main><nav aria-label="Portrait test controls" style="padding:24px"><button id="show-npc">Show Captain Rennick</button><button id="show-player">Show player</button><button id="dismiss">Dismiss reaction</button><button id="clear">Clear reaction</button></nav><p id="preview-status" role="status" style="padding:24px;color:white">Loading test controls</p><script src="racers-v2/config.js?v=portrait-clean-02"></script><script src="racers-v2/reaction-view.js?v=portrait-clean-02"></script><script>
(async()=>{const response=await fetch('prototype-03.html'),html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html'),dock=doc.querySelector('#reaction-dock');document.querySelector('#preview').append(dock);const view=window.ReactionView.create(dock,window.MARBLE_CONFIG.shared,{reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});document.querySelector('#show-npc').onclick=()=>view.render({reaction:{who:'npc',text:'A bump from the side. Steady now.'}});document.querySelector('#show-player').onclick=()=>view.render({reaction:{who:'player',text:'Single-character reaction using the other existing portrait.'}});document.querySelector('#dismiss').onclick=()=>view.render(null);document.querySelector('#clear').onclick=()=>view.clear();document.querySelector('#preview-status').textContent='Ready: production reaction presenter, markup and styles';})();
</script></body></html>
